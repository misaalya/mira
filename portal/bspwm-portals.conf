[preferred]
# Sesi X11 (bspwm): portal tetap memakai backend GTK untuk antarmuka lain,
# tapi dialog file (upload/download browser, "Save as", lampiran) diarahkan
# ke termfilechooser → yazi di Ghostty.
#
# Nama berkas ini mengikuti XDG_CURRENT_DESKTOP (lihat bspwm/bspwmrc),
# jadi sesi Plasma dan Hyprland punya berkasnya sendiri dan tidak tersentuh.
# Tanpa berkas ini, /usr/share/xdg-desktop-portal/bspwm-portals.conf memilih
# gtk untuk FileChooser — itulah dialog GTK yang muncul, bukan yazi.
default = gtk
org.freedesktop.impl.portal.FileChooser = termfilechooser
