## ----- General Settings ----- ##

# Available backends "xrender" "glx" "egl"
backend = "glx";

dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
# Damage tracking: only the parts of the screen that changed are repainted.
# With it off, every change (a blinking cursor, a video) repainted both
# monitors in full, ~4-7% of a core at idle. It was once turned off because
# windows mapped after startup (Ghostty, a re-opened eww bar) stayed
# invisible under glx; re-tested on picom v12.5 (2026-11-17): new xterm and
# Ghostty windows show up. If they vanish again, set this back to false.
use-damage = true;
log-level = "error";

## ----- Shadows ----- ##

shadow = false;
shadow-radius = 7;
shadow-opacity = 0.25
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-color = "#000000"

## ----- Fading ----- ##

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 6
no-fading-openclose = false
no-fading-destroyed-argb = false

## ----- Transparency ----- ##

frame-opacity = 1.0;
#inactive-dim-fixed = true

## ----- Corners ----- ##

corner-radius = 6

## ----- Rules ----- ##

@include "picom-rules.conf"
