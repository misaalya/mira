    animations = (

        {
            triggers = ["close"];
            opacity = {
                curve = "cubic-bezier(0,1,1,1)";
                duration = 0.3;
                start = "window-raw-opacity-before";
                end = 0;
            };

            blur-opacity = "opacity";
            shadow-opacity = "opacity";

            scale-x = {
                curve = "cubic-bezier(0,1.3,1,1)";
                duration = 0.3;
                start = 1;
                end = 0.6;
            };

            scale-y = "scale-x";
            offset-x = "(1 - scale-x) / 2 * window-width";
            offset-y = "(1 - scale-y) / 2 * window-height";

            shadow-scale-x = "scale-x";
            shadow-scale-y = "scale-y";
            shadow-offset-x = "offset-x";
            shadow-offset-y = "offset-y";
        },

        {
            triggers = ["open"];
            opacity = {
                curve = "cubic-bezier(0,1,1,1)";
                duration = 0.5;
                start = 0;
                end = "window-raw-opacity";
            };

            blur-opacity = "opacity";
            shadow-opacity = "opacity";

            scale-x = {
                curve = "cubic-bezier(0,1.3,1,1)";
                duration = 0.5;
                start = 0.6;
                end = 1;
            };

            scale-y = "scale-x";
            offset-x = "(1 - scale-x) / 2 * window-width";
            offset-y = "(1 - scale-y) / 2 * window-height";

            shadow-scale-x = "scale-x";
            shadow-scale-y = "scale-y";
            shadow-offset-x = "offset-x";
            shadow-offset-y = "offset-y";
        },

        # Moves and resizes (including Scroll columns sliding): ease-out that
        # lands exactly on the target, so nothing bounces, and is quick.
        {
            triggers = ["geometry"];
            scale-x = {
                curve = "cubic-bezier(0.25,0.8,0.25,1)";
                duration = 0.22;
                start = "window-width-before / window-width";
                end = 1;
            };

            scale-x-reverse = {
                curve = "cubic-bezier(0.25,0.8,0.25,1)";
                duration = 0.22;
                start = "window-width / window-width-before";
                end = 1;
            };

            scale-y = {
                curve = "cubic-bezier(0.25,0.8,0.25,1)";
                duration = 0.22;
                start = "window-height-before / window-height";
                end = 1;
            };

            scale-y-reverse = {
                curve = "cubic-bezier(0.25,0.8,0.25,1)";
                duration = 0.22;
                start = "window-height / window-height-before";
                end = 1;
            };

            offset-x = {
                curve = "cubic-bezier(0.25,0.8,0.25,1)";
                duration = 0.22;
                start = "window-x-before - window-x";
                end = 0;
            };

            offset-y = {
                curve = "cubic-bezier(0.25,0.8,0.25,1)";
                duration = 0.22;
                start = "window-y-before - window-y";
                end = 0;
            };

            shadow-scale-x = "scale-x";
            shadow-scale-y = "scale-y";

            shadow-offset-x = "offset-x";
            shadow-offset-y = "offset-y";
        }
    )
