# Background blur for windows whose rule sets blur-background (misa-backdrop,
# CardPicker, optional terminal blur toggled per theme via P_BLUR).
blur:

	{
		method = "dual_kawase";
		strength = 3;
	}

rules: (

	{
		blur-background = false;
		fade = false;
	},

	{
		# Bar panels are excluded: they resize themselves while a page slides
		# (WifiPanel / BluetoothPanel follow the height every frame), and the
		# geometry animation below would stretch the old image over it.
		match = "window_type = 'normal'
				&& !(class_g = 'Rofi'
					|| class_g = 'mpv'
					|| class_g = 'WifiPanel' || class_g = 'BluetoothPanel'
					|| class_g = 'ClipPanel' || class_g = 'NotifCenter'
					|| class_g = 'WindowSwitch')";

		@include "picom-animations.conf"
		fade = true;	#-fade-switch
		shadow = true;	#-shadow-switch
	},

	{
		match = "window_type = 'dialog'";
		fade = true;	#-fade-switch
		shadow = true;	#-shadow-switch
	},

	{
		match = "window_type = 'tooltip'";
		corner-radius = 0;
		opacity = 0.90;
	},

	{
		match = "fullscreen";
		corner-radius = 0;
	},

	{
		match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'popup' || window_type = 'popup_menu'";
		corner-radius = 0;
		shadow = false;
	},

## ----- Mira & app rules ----- ##

	{
		match = "class_g = 'Polybar' || window_type = 'dock' || class_g = 'Eww'";
		fade = true;
		corner-radius = 0;
		shadow = false;
	},

	{
		match = "class_g = 'firefox' || _GTK_FRAME_EXTENTS@";
		shadow = false;
	},

	{
		# x-shot's overlay shows a frozen copy of the screen: any fade,
		# shadow or rounding would make it visibly differ from what is
		# underneath.
		match = "class_g = 'x-shot'";
		fade = false;
		shadow = false;
		corner-radius = 0;
		blur-background = false;
	},

	{
		# Terminal: frosted glass behind a translucent background
		# (P_TERM_OPACITY sets Ghostty's background-opacity).
		match = "class_g = 'com.mitchellh.ghostty' || class_g = 'Alacritty' || "
				"class_g = 'kitty' || class_g = 'XTerm'";
		blur-background = false;	#-blur-switch
	},

	{
		# Rofi (keybinds / hidden-windows fallback): short fade + slight zoom.
		match = "class_g = 'Rofi'";
		corner-radius = 0;
		shadow = false;
		blur-background = false;
		animations = (

			{
				triggers = ["open", "show"];
				opacity = {
					curve = "cubic-bezier(0.2,0.8,0.2,1)";
					duration = 0.18;
					start = 0;
					end = "window-raw-opacity";
				};
				scale-x = {
					curve = "cubic-bezier(0.2,0.8,0.2,1)";
					duration = 0.18;
					start = 0.94;
					end = 1;
				};
				scale-y = "scale-x";
				offset-x = "(1 - scale-x) / 2 * window-width";
				offset-y = "(1 - scale-y) / 2 * window-height";
			},

			{
				triggers = ["close", "hide"];
				opacity = {
					curve = "cubic-bezier(0.4,0,1,1)";
					duration = 0.12;
					start = "window-raw-opacity-before";
					end = 0;
				};
				scale-x = {
					curve = "cubic-bezier(0.4,0,1,1)";
					duration = 0.12;
					start = 1;
					end = 0.96;
				};
				scale-y = "scale-x";
				offset-x = "(1 - scale-x) / 2 * window-width";
				offset-y = "(1 - scale-y) / 2 * window-height";
			}
		)
	},

	{
		# Bar panels: launcher (rofi drun), power menu ("rofi - Bar panel"),
		# eww volume & music panels, and native GTK3 panels (WindowSwitch,
		# ClipPanel, WifiPanel, BluetoothPanel, NotifCenter).
		match = "(class_g = 'Rofi' && (name = 'rofi - drun' || name = 'rofi - Bar panel')) || "
				"name = 'Eww - volume' || name = 'Eww - music' || class_g = 'WindowSwitch' || "
				"class_g = 'ClipPanel' || class_g = 'WifiPanel' || class_g = 'BluetoothPanel' || "
				"class_g = 'NotifCenter'";
		corner-radius = 0;
		shadow = false;
		blur-background = false;
		animations = (

			{
				triggers = ["open", "show"];
				opacity = {
					curve = "cubic-bezier(0.2,0.8,0.2,1)";
					duration = 0.14;
					start = 0;
					end = "window-raw-opacity";
				};
				blur-opacity = "opacity";
				scale-y = {
					curve = "cubic-bezier(0.34,1.4,0.64,1)";
					duration = 0.24;
					start = 0.9;
					end = 1;
				};
				scale-x = {
					curve = "cubic-bezier(0.34,1.4,0.64,1)";
					duration = 0.24;
					start = 0.97;
					end = 1;
				};
				offset-x = "(1 - scale-x) / 2 * window-width";
			},

			{
				triggers = ["close", "hide"];
				opacity = {
					curve = "cubic-bezier(0.4,0,1,1)";
					duration = 0.1;
					start = "window-raw-opacity-before";
					end = 0;
				};
				blur-opacity = "opacity";
				scale-y = {
					curve = "cubic-bezier(0.4,0,1,1)";
					duration = 0.1;
					start = 1;
					end = 0.96;
				};
			}
		)
	},

	{
		# Backdrop behind popups (bin/misa-backdrop): half opacity + dual_kawase blur.
		match = "class_g = 'Backdrop'";
		opacity = 0.5;
		blur-background = true;
		shadow = false;
		corner-radius = 0;
		animations = (

			{
				triggers = ["open", "show"];
				opacity = {
					curve = "cubic-bezier(0.2,0.8,0.2,1)";
					duration = 0.18;
					start = 0;
					end = "window-raw-opacity";
				};
				blur-opacity = "opacity";
			},

			{
				triggers = ["close", "hide"];
				opacity = {
					curve = "cubic-bezier(0.4,0,1,1)";
					duration = 0.14;
					start = "window-raw-opacity-before";
					end = 0;
				};
				blur-opacity = "opacity";
			}
		)
	},

	{
		# CardPicker (theme / bar / wallpaper pickers): translucent window over
		# blurred desktop, starting below the bar so the bar stays sharp.
		match = "class_g = 'CardPicker'";
		corner-radius = 0;
		shadow = false;
		blur-background = true;
		animations = (

			{
				triggers = ["open", "show"];
				opacity = {
					curve = "cubic-bezier(0.2,0.8,0.2,1)";
					duration = 0.2;
					start = 0;
					end = "window-raw-opacity";
				};
				blur-opacity = "opacity";
			},

			{
				triggers = ["close", "hide"];
				opacity = {
					curve = "cubic-bezier(0.4,0,1,1)";
					duration = 0.14;
					start = "window-raw-opacity-before";
					end = 0;
				};
				blur-opacity = "opacity";
			}
		)
	},

	{
		# Now-playing corner bubble (bin/MediaPillUI).
		match = "class_g = 'MediaPill'";
		corner-radius = 0;
		shadow = false;
		blur-background = false;
		animations = (

			{
				triggers = ["open", "show"];
				opacity = {
					curve = "cubic-bezier(0.2,0.8,0.2,1)";
					duration = 0.2;
					start = 0;
					end = "window-raw-opacity";
				};
				scale-x = {
					curve = "cubic-bezier(0.34,1.56,0.64,1)";
					duration = 0.36;
					start = 0.4;
					end = 1;
				};
				scale-y = "scale-x";
				offset-x = "(1 - scale-x) / 2 * window-width";
				offset-y = "(1 - scale-y) / 2 * window-height";
			},

			{
				triggers = ["close", "hide"];
				opacity = {
					curve = "cubic-bezier(0.4,0,1,1)";
					duration = 0.16;
					start = "window-raw-opacity-before";
					end = 0;
				};
				scale-x = {
					curve = "cubic-bezier(0.4,0,1,1)";
					duration = 0.16;
					start = 1;
					end = 0.6;
				};
				scale-y = "scale-x";
				offset-x = "(1 - scale-x) / 2 * window-width";
				offset-y = "(1 - scale-y) / 2 * window-height";
			}
		)
	},

	{
		# Notification banners & OSD (bin/NotifPanel --daemon).
		match = "class_g = 'NotifToast'";
		corner-radius = 0;
		shadow = false;
		blur-background = false;
		animations = (

			{
				triggers = ["open", "show"];
				opacity = {
					curve = "cubic-bezier(0.2,0.8,0.2,1)";
					duration = 0.2;
					start = 0;
					end = "window-raw-opacity";
				};
				offset-x = {
					curve = "cubic-bezier(0.16,1,0.3,1)";
					duration = 0.28;
					start = 36;
					end = 0;
				};
				scale-x = {
					curve = "cubic-bezier(0.16,1,0.3,1)";
					duration = 0.28;
					start = 0.96;
					end = 1;
				};
				scale-y = "scale-x";
				offset-y = "(1 - scale-y) / 2 * window-height";
			},

			{
				triggers = ["close", "hide"];
				opacity = {
					curve = "cubic-bezier(0.4,0,1,1)";
					duration = 0.16;
					start = "window-raw-opacity-before";
					end = 0;
				};
				offset-x = {
					curve = "cubic-bezier(0.4,0,1,1)";
					duration = 0.16;
					start = 0;
					end = 28;
				};
			}
		)
	},

	{
		# Live GPU shader wallpaper layer (misa-wall --live-daemon): sits below all
		# windows & Polybar; zero shadow/fade/rounding so picom blurs it cleanly.
		match = "class_g = 'MisaWallLive' || window_type = 'desktop'";
		fade = false;
		shadow = false;
		corner-radius = 0;
		blur-background = false;
	},

	{
		match = "class_g = 'mpv'";
		corner-radius = 0;
		fade = true;	#-fade-switch
		shadow = false;
	}
)
