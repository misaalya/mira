# Scroll strip settings (read by bin/Scroll at start-up; restart the daemon
# after editing). Same names and meaning as the `scrolling` block of the
# Hyprland rice, so both sessions feel alike.

# Default width of a column, as a fraction of the desktop width (0.1 - 1.0).
column_width = 0.6

# Presets that `Scroll width next|prev` (super + period / comma) cycle through.
explicit_column_widths = 0.333, 0.5, 0.667, 1.0

# `Scroll width grow|shrink` (super + ctrl + Right / Left) changes the focused
# column by this fraction per press.
resize_step = 0.05

# A column can never be narrower than this fraction.
min_column_width = 0.1

# After a mouse resize/move, wait this many milliseconds without further
# geometry events before the strip adopts the new width (or snaps the column
# back), so the layout does not fight the pointer mid-drag.
settle_ms = 200

# Pixels of the neighbouring column kept on screen next to the focused one, so
# the screen edge always has something to click to scroll there. Skipped when
# it would crop the focused column. 0 turns it off.
edge_peek = 40

# When the focused column fills the screen no neighbour is on screen to click.
# Then a click on the far left / right edge, this many pixels wide, focuses
# the column on that side and the strip scrolls to it. 0 turns it off.
edge_click = 4

# super + v on a column floats it centred above the strip at this fraction of
# the desktop (a window that floated before gets its old spot back). Pressing
# it again puts the window back on the strip with its old width.
float_width = 0.5
float_height = 0.6
