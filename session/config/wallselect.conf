# WallSelect settings (shell syntax, read by bin/WallSelect every time it runs).
#
# Folder with your own wallpapers. Everything in it is listed in the menu next
# to the wallpapers of the current rice, and the "Add wallpaper" tile copies
# the images you pick into it. Leave empty for $XDG_PICTURES_DIR/Wallpapers
# (the same folder the Hyprland session uses).
#
# USER_WALL_DIR="$HOME/Pictures/Wallpapers"
USER_WALL_DIR=""
