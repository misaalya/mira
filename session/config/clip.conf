# Clipboard history settings (read by misa-clip at start-up; restart it after
# editing: `misa-clip quit`, then reload bspwm, or run
# `misa-clip daemon --config ~/.config/bspwm/config/clip.conf &`).

# Entries kept, newest first.
max_items = 200

# Texts larger than this many bytes are not stored (1 MiB).
max_bytes = 1048576

# Copied images (image/png, e.g. from x-shot or a browser) larger than this
# are not stored (32 MiB). They are kept as PNG files in
# $XDG_DATA_HOME/misa-clip/images; 0 turns image history off.
max_image_bytes = 33554432

# When the program you copied from exits, keep its text on the clipboard
# (misa-clip serves it) instead of leaving the clipboard empty.
keep_clipboard = true

# Keep the history across sessions in $XDG_DATA_HOME/misa-clip/history
# (mode 0600). With false the history lives in memory only.
persist = true

# Width of a history line in the picker, in characters.
preview_chars = 120
