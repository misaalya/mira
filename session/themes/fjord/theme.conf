# Fjord — Quiet Nordic coastal fog, dark basalt-slate, and glacier steel-blue
# Calm, desaturated Scandinavian atmosphere with silver sea mist and clean Inter
# typography over a transparent minimal topbar.

# Palette
bg="#101419"
bg_alt="#181f27"
fg="#e4ecf2"
trans="#00000000"

black="#1c242e"
red="#d67a7a"
green="#82b89e"
yellow="#d9c68a"
blue="#8db7d4"
magenta="#a89ec9"
cyan="#7ebac4"
white="#e4ecf2"
blackb="#546476"
redb="#e89696"
greenb="#9fd1b9"
yellowb="#eadba6"
blueb="#a9cde6"
magentab="#c1b8de"
cyanb="#9cd2db"
whiteb="#f6fafd"

purple="#a89ec9"
amber="#d4b57e"
pink="#cfa1b0"
orange="#d49876"
indigo="#859ec9"
lime="#a4c48e"
grey="#7c8d9e"
bluegray="#6c8094"

accent_color="#8db7d4"

# Bar
main_bar="mira-minimal"

# Typography
ui_font="Inter"
display_font="Inter Black"
gtk_font="Inter 10"
term_font_name="JetBrainsMono Nerd Font"
term_font_size="10"

# BSPWM
BORDER_WIDTH="1"
TOP_PADDING="1"
BOTTOM_PADDING="1"
LEFT_PADDING="1"
RIGHT_PADDING="1"
NORMAL_BC="#212a35"
FOCUSED_BC="#8db7d4"

# Picom
P_FADE="true"
P_SHADOWS="true"
SHADOW_C="#06090d"
P_CORNER_R="10"
P_BLUR="true"
P_ANIMATIONS="@"
P_TERM_OPACITY="0.93"

# Rofi & native panel palette (exported to config/rofi/shared.rasi)
rofi_font="Inter Medium 10"
rofi_background="$bg"
rofi_bg_alt="$bg_alt"
rofi_background_alt="${bg}E6"
rofi_fg="$fg"
rofi_selected="$accent_color"
rofi_active="$cyan"
rofi_urgent="$red"

# GTK
gtk_theme="Adwaita-dark"
gtk_icons="Papirus-Dark"
gtk_cursor="everforest-cursors"

# Wallpaper (Default | Random | CustomDir)
ENGINE="Default"
CUSTOM_DIR=""
DEFAULT_WALL="${MIRA_DIR}/themes/fjord/walls/wall-01.webp"
