# Mira — Default monochrome theme definition
# Near-pure black, soft white, neutral greys, single yellow bar accent.

# Palette
bg="#000000"
bg_alt="#0f0f0f"
fg="#e6e6e6"
trans="#00000000"

black="#141414"
red="#e5675f"
green="#9ccf7f"
yellow="#d9d84a"
blue="#8aa4c8"
magenta="#b79ad6"
cyan="#82c7c4"
white="#e6e6e6"
blackb="#4a4a4a"
redb="#f07c74"
greenb="#b0dc96"
yellowb="#e6e566"
blueb="#a2b8d8"
magentab="#c8b0e2"
cyanb="#9ad6d3"
whiteb="#ffffff"

purple="#b79ad6"
amber="#e0b85a"
pink="#e09ab4"
orange="#e0905a"
indigo="#8a8fd6"
lime="#c2d65a"
grey="#7a7a7a"
bluegray="#8a94a6"

accent_color="$yellow"

# Bar
main_bar="mira"

# Typography
ui_font="Inter"
display_font="Inter Black"
gtk_font="Inter 10"
term_font_name="JetBrainsMono Nerd Font"
term_font_size="10"

# BSPWM
BORDER_WIDTH="0"
TOP_PADDING="1"
BOTTOM_PADDING="1"
LEFT_PADDING="1"
RIGHT_PADDING="1"
NORMAL_BC="$black"
FOCUSED_BC="$grey"

# Picom
P_FADE="true"
P_SHADOWS="true"
SHADOW_C="#000000"
P_CORNER_R="8"
P_BLUR="false"
P_ANIMATIONS="@"
P_TERM_OPACITY="1.0"

# Rofi & native panel palette (exported to config/rofi/shared.rasi)
rofi_font="Inter Medium 10"
rofi_background="$bg"
rofi_bg_alt="$black"
rofi_background_alt="${bg}E0"
rofi_fg="$fg"
rofi_selected="$fg"
rofi_active="$fg"
rofi_urgent="$red"

# GTK
gtk_theme="Adwaita-dark"
gtk_icons="Papirus-Dark"
gtk_cursor="everforest-cursors"

# Wallpaper (Default | Random | CustomDir)
ENGINE="Default"
CUSTOM_DIR=""
DEFAULT_WALL="${MIRA_DIR}/themes/mira/walls/wall-01.webp"
