# Ember — Dramatic volcanic obsidian & Japanese vermilion lacquer theme
# Deep warm obsidian, warm ivory text, glowing vermilion-ember accent, amber gold highlights.

# Palette
bg="#120d0c"
bg_alt="#1c1513"
fg="#f2e9e1"
trans="#00000000"

black="#211917"
red="#e55b50"
green="#8fb87c"
yellow="#eab354"
blue="#7e9cb8"
magenta="#cf89a4"
cyan="#78b0ab"
white="#f2e9e1"
blackb="#5e4b45"
redb="#f5786e"
greenb="#a8cf96"
yellowb="#f7c873"
blueb="#9bb5cf"
magentab="#e0a3ba"
cyanb="#93c7c2"
whiteb="#fffaf5"

purple="#b68bc2"
amber="#eab354"
pink="#e094a8"
orange="#f07148"
indigo="#8b8fc4"
lime="#b8c96b"
grey="#8c7a73"
bluegray="#7d8a96"

accent_color="#f07148"

# Bar
main_bar="mira-line"

# Typography
ui_font="Inter"
display_font="Inter Black"
gtk_font="Inter 10"
term_font_name="JetBrainsMono Nerd Font"
term_font_size="10"

# BSPWM
BORDER_WIDTH="1"
TOP_PADDING="1"
BOTTOM_PADDING="1"
LEFT_PADDING="1"
RIGHT_PADDING="1"
NORMAL_BC="#291f1c"
FOCUSED_BC="#f07148"

# Picom
P_FADE="true"
P_SHADOWS="true"
SHADOW_C="#070404"
P_CORNER_R="6"
P_BLUR="false"
P_ANIMATIONS="@"
P_TERM_OPACITY="0.96"

# Rofi & native panel palette (exported to config/rofi/shared.rasi)
rofi_font="Inter Medium 10"
rofi_background="$bg"
rofi_bg_alt="$bg_alt"
rofi_background_alt="${bg}E0"
rofi_fg="$fg"
rofi_selected="$accent_color"
rofi_active="$accent_color"
rofi_urgent="$red"

# GTK
gtk_theme="Adwaita-dark"
gtk_icons="Papirus-Dark"
gtk_cursor="everforest-cursors"

# Wallpaper (Default | Random | CustomDir)
ENGINE="Default"
CUSTOM_DIR=""
DEFAULT_WALL="${MIRA_DIR}/themes/ember/walls/wall-01.webp"
