# Matcha — Organic Japanese botanical forest theme for Mira
# Deep mossy charcoal, warm parchment cream, sage leaves, and matcha-olive accents.

# Palette
bg="#111714"
bg_alt="#19211d"
fg="#e8e4d5"
trans="#00000000"

black="#1d2621"
red="#d97a6c"
green="#98be7c"
yellow="#dfc074"
blue="#7fa8a8"
magenta="#b894b2"
cyan="#7bb8a4"
white="#e8e4d5"
blackb="#4e5e54"
redb="#e89487"
greenb="#b3d499"
yellowb="#ebd391"
blueb="#9bc0c0"
magentab="#ceaec8"
cyanb="#96cfb9"
whiteb="#f7f4eb"

purple="#b894b2"
amber="#d9ad68"
pink="#d69ca8"
orange="#d68f63"
indigo="#8596b8"
lime="#b8cc7a"
grey="#7e8f84"
bluegray="#728988"

accent_color="#b8cc7a"

# Bar
main_bar="mira-islands"

# Typography
ui_font="Inter"
display_font="Inter Black"
gtk_font="Inter 10"
term_font_name="JetBrainsMono Nerd Font"
term_font_size="10"

# BSPWM
BORDER_WIDTH="1"
TOP_PADDING="1"
BOTTOM_PADDING="1"
LEFT_PADDING="1"
RIGHT_PADDING="1"
NORMAL_BC="#222d27"
FOCUSED_BC="#b8cc7a"

# Picom
P_FADE="true"
P_SHADOWS="true"
SHADOW_C="#080c0a"
P_CORNER_R="10"
P_BLUR="true"
P_ANIMATIONS="@"
P_TERM_OPACITY="0.94"

# Rofi & native panel palette (exported to config/rofi/shared.rasi)
rofi_font="Inter Medium 10"
rofi_background="$bg"
rofi_bg_alt="$black"
rofi_background_alt="${bg}E0"
rofi_fg="$fg"
rofi_selected="$accent_color"
rofi_active="$green"
rofi_urgent="$red"

# GTK
gtk_theme="Adwaita-dark"
gtk_icons="Papirus-Dark"
gtk_cursor="everforest-cursors"

# Wallpaper (Default | Random | CustomDir)
ENGINE="Default"
CUSTOM_DIR=""
DEFAULT_WALL="${MIRA_DIR}/themes/matcha/walls/wall-01.webp"
