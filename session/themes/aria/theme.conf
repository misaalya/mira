# Aria — Nocturnal pixel-dithered aurora & crisp sans-serif theme
# Deep midnight navy surfaces, frost-white Inter typography, luminous aurora mint
# accent, and periwinkle dawn blues.

# Palette
bg="#081020"
bg_alt="#0f1b33"
fg="#eff4ff"
trans="#00000000"

black="#12203b"
red="#f07585"
green="#5ce6b8"
yellow="#ebd680"
blue="#7ea4f0"
magenta="#b39ef5"
cyan="#6be0d8"
white="#eff4ff"
blackb="#4b6491"
redb="#f7919e"
greenb="#82f2cb"
yellowb="#f4e39c"
blueb="#9cbcf8"
magentab="#c8b8fa"
cyanb="#8febdf"
whiteb="#ffffff"

purple="#b39ef5"
amber="#e8c374"
pink="#f09bb8"
orange="#ed9d74"
indigo="#6c8ce8"
lime="#9ce89e"
grey="#7c96c4"
bluegray="#5e78a8"

accent_color="#5ce6b8"

# Bar
main_bar="mira-float"

# Typography
ui_font="Inter"
display_font="Inter Black"
gtk_font="Inter 10"
term_font_name="JetBrainsMono Nerd Font"
term_font_size="10"

# BSPWM
BORDER_WIDTH="1"
TOP_PADDING="1"
BOTTOM_PADDING="1"
LEFT_PADDING="1"
RIGHT_PADDING="1"
NORMAL_BC="#18294a"
FOCUSED_BC="#5ce6b8"

# Picom
P_FADE="true"
P_SHADOWS="true"
SHADOW_C="#030814"
P_CORNER_R="12"
P_BLUR="true"
P_ANIMATIONS="@"
P_TERM_OPACITY="0.92"

# Rofi & native panel palette (exported to config/rofi/shared.rasi)
rofi_font="Inter Medium 10"
rofi_background="$bg"
rofi_bg_alt="$black"
rofi_background_alt="${bg}E6"
rofi_fg="$fg"
rofi_selected="$accent_color"
rofi_active="$blue"
rofi_urgent="$red"

# GTK
gtk_theme="Adwaita-dark"
gtk_icons="Papirus-Dark"
gtk_cursor="everforest-cursors"

# Wallpaper (Default | Random | CustomDir)
ENGINE="Default"
CUSTOM_DIR=""
DEFAULT_WALL="${MIRA_DIR}/themes/aria/walls/wall-01.webp"
