;; Mira topbar modules. Colours: fg (icons/text), grey (secondary),
;; yellow (the single accent), red (alerts), bg (pill text).

;; ── left ──────────────────────────────────────────────────────────────

[module/search]
type = custom/text
label = "󰍉"
label-font = 2
click-left = RofiLauncher --launcher --pointer
click-right = RiceSelector

[module/shot]
type = custom/text
label = "󰹑"
label-font = 2
click-left = OpenApps --screenshot

;; Workspaces as dots (the bar15 style), in the rice's colours: focused =
;; double ring in the text colour, occupied = dotted ring, empty = small dim
;; dot, urgent = accent. All eight are shown, so position = number.
[module/ws]
type = internal/bspwm
enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false

format = <label-state>
format-font = 2

label-focused = 󰺕
label-focused-padding = 3px
label-focused-foreground = ${color.fg}

label-occupied = 󰀚
label-occupied-padding = 3px
label-occupied-foreground = ${color.fg}

label-urgent = 󰀚
label-urgent-padding = 3px
label-urgent-foreground = ${color.pill}

label-empty = 󰑊
label-empty-padding = 3px
label-empty-foreground = ${color.grey}

[module/rice]
type = custom/text
label = "󰸌"
label-font = 2
click-left = RiceSelector
click-right = BarSelector

[module/wall]
type = custom/text
label = "󰥶"
label-font = 2
click-left = WallSelect

;; Name must stay "layout": bin/Layout pokes "#layout.hook.0" on change.
[module/layout]
type = custom/ipc
hook-0 = Layout icon --bar
initial = 1
format = <label>
label-font = 2
click-left = Layout next --bar
click-right = Layout prev --bar

[module/clip]
type = custom/text
label = "󰨸"
label-font = 2
click-left = ClipMenu --pointer

;; Notification history count; bell-off when Do Not Disturb is active.
;; Pushed by bin/NotifPanel over IPC (zero polling).
;; Name must stay "notif": bin/NotifPanel pokes "#notif.hook.0" on change.
[module/notif]
type = custom/ipc
hook-0 = "$MIRA_CONFIG_DIR/bars/mira/scripts/notif"
initial = 1
format = <label>
label = %output%
click-left = NotifPanel --pointer
click-right = NotifPanel dnd toggle

;; Updates count, pushed by bin/Updates over IPC (no polling).
;; Name must stay "updates": bin/Updates pokes "#updates.hook.0".
[module/updates]
type = custom/ipc
hook-0 = Updates --cached
initial = 1
format = <label>
format-prefix = "󰆧 "
format-prefix-font = 2
label = %output%
click-left = OpenApps --checkupdates

;; ── centre ────────────────────────────────────────────────────────────

[module/date]
type = internal/date
interval = 5
time = %H:%M
date = %a %d %b
label = "%time%   %date%"

;; ── right ─────────────────────────────────────────────────────────────

[module/tray]
type = internal/tray
format = <tray>
tray-background = ${color.bg}
tray-foreground = ${color.fg}
tray-spacing = 6px
tray-size = 80%

;; The one accent icon.
[module/media]
type = custom/text
label = "󰎈"
label-font = 2
label-foreground = ${color.pill}
; Left: the music panel; right: play/pause without opening it.
click-left = BarPanel toggle music --pointer
click-right = MediaControl --toggle

[module/bluetooth]
type = custom/script
exec = bluetooth-polybar.sh fg grey
interval = 10
format = <label>
format-font = 2
label = %output%
click-left = OpenApps --bluetooth --pointer

[module/network]
type = internal/network
interface = ${system.sys_network_interface}
interval = 5
format-connected = <label-connected>
label-connected = "%{A1:OpenApps --netmanager --pointer:}%{T2}󰖩%{T-}%{A}"
format-disconnected = <label-disconnected>
label-disconnected = "%{A1:OpenApps --netmanager --pointer:}%{T2}󰖪%{T-}%{A}"
label-disconnected-foreground = ${color.grey}

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
; Left click opens the volume panel (bin/VolumeCtl, eww) under the bar; the
; wheel changes the volume right on the bar; middle click mutes.
format-volume = %{A1:VolumeCtl popup --pointer:}<ramp-volume> <label-volume>%{A}
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 2
format-muted = %{A1:VolumeCtl popup --pointer:}<label-muted>%{A}
label-muted = "%{T2}󰖁%{T-}"
label-muted-foreground = ${color.grey}
click-middle = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = OpenApps --soundcontrol

;; CPU and memory: icon, a one-glyph level bar, value (as in the reference).
[module/cpu]
type = internal/cpu
interval = 2
; Same pattern as the other status modules: icon + value. Processor = a
; square chip (mdi "memory"); RAM below = an elongated chip (mdi "chip").
format = <label>
format-prefix = "󰍛 "
format-prefix-font = 2
label = "%percentage%%"

[module/memory]
type = internal/memory
interval = 5
format = <label>
format-prefix = "󰘚 "
format-prefix-font = 2
label = "%used%"

[module/battery]
type = internal/battery
full-at = 99
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 10
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = "%{T2}󰁹%{T-} %percentage%%"
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰂂
ramp-capacity-font = 2
ramp-capacity-0-foreground = ${color.red}
animation-charging-0 = 󰂄
animation-charging-font = 2
animation-charging-framerate = 2000

[module/power]
type = custom/text
label = "󰐥"
label-font = 2
click-left = PowerMenu --pointer
