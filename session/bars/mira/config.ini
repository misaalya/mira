;; ┌──────────────────────────────────────────────┐
;; │ mira — tall, icon-heavy, monospace topbar    │
;; └──────────────────────────────────────────────┘
;; Layout only: every colour comes from the active theme (../colors.ini), so
;; any theme can use this bar. Made for Mira (black, white icons, one accent).
;;
;; Height trick: the drawable area is 24px (the pill height) and the 10px
;; top/bottom borders in the bar colour make it 44px tall. Polybar fills a
;; %{B} background over the whole drawable height, so this is what lets the
;; workspace pills be shorter than the bar.
;;
;; Kept light: internal modules wherever possible (no processes); notifications
;; and updates counts are pushed over IPC (zero polling).

[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = ../colors.ini
include-file = modules.ini

[bar/mira]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = true

width = 100%
height = 24
offset-x = 0
offset-y = 0

background = ${color.bg}
foreground = ${color.fg}

radius = 0
line-size = 0

border-top-size = 10
border-bottom-size = 10
border-color = ${color.bg}

padding-left = 14px
padding-right = 14px
module-margin = 5px

; 1 text · 2 icons
font-0 = "JetBrainsMono Nerd Font:style=Bold:pixelsize=15;4"
font-1 = "Material Design Icons Desktop:pixelsize=20;4"

modules-left = search shot ws rice wall layout clip notif updates
modules-center = date
modules-right = tray media bluetooth network volume cpu memory battery power

separator =
dim-value = 1.0

wm-restack = bspwm
enable-struts = true
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]
screenchange-reload = false
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false
