;; ┌──────────────────────────────────────────────────────┐
;; │ mira-minimal — slim 30px distraction-free topbar     │
;; └──────────────────────────────────────────────────────┘
;; Layout only: every colour comes from the active theme (../colors.ini).
;; Quiet, low-height monochrome strip: hides empty workspaces and trims
;; secondary widgets while keeping every popup one click away.

[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = ../colors.ini
include-file = modules.ini

[bar/mira-minimal]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = true

width = 100%
height = 30
offset-x = 0
offset-y = 0

background = ${color.bg}
foreground = ${color.fg}

radius = 0
line-size = 0

padding-left = 12px
padding-right = 12px
module-margin = 6px

; 1 UI text · 2 icons · 3 mono digits
font-0 = "Inter:style=Medium:pixelsize=12;3"
font-1 = "Material Design Icons Desktop:pixelsize=16;3"
font-2 = "JetBrainsMono Nerd Font:style=SemiBold:pixelsize=12;3"

modules-left = search ws layout
modules-center = clock cal
modules-right = tray media notif network volume battery power

separator =
dim-value = 1.0

wm-restack = bspwm
enable-struts = true
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]
screenchange-reload = false
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false
