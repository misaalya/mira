;; ┌──────────────────────────────────────────────────────┐
;; │ mira-float — floating rounded topbar with underlines │
;; └──────────────────────────────────────────────────────┘
;; Layout only: every colour comes from the active theme (../colors.ini).
;; Detached from the screen edges using transparent borders so override-redirect
;; stays false and BSPWM struts + BarAnchor popups align automatically.

[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = ../colors.ini
include-file = modules.ini

[bar/mira-float]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = true

width = 100%
height = 34
offset-x = 0
offset-y = 0

background = ${env:MIRA_BG_ARGB:#ff000000}
foreground = ${color.fg}

radius = 12
line-size = 0

border-top-size = 8
border-bottom-size = 2
border-left-size = 12
border-right-size = 12
border-color = ${color.trans}

padding-left = 14px
padding-right = 14px
module-margin = 5px

; 1 UI text · 2 icons · 3 mono metrics
font-0 = "Inter:style=SemiBold:pixelsize=13;3"
font-1 = "Material Design Icons Desktop:pixelsize=18;4"
font-2 = "JetBrainsMono Nerd Font:style=SemiBold:pixelsize=13;3"

modules-left = search ws sep rice wall layout clip notif updates
modules-center = clock dot cal
modules-right = tray media bluetooth network volume sep cpu memory battery sep power

separator =
dim-value = 1.0

wm-restack = bspwm
enable-struts = true
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]
screenchange-reload = false
compositing-background = over
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false
