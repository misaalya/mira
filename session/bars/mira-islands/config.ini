;; ┌────────────────────────────────────────────────────────┐
;; │ mira-islands — floating capsules grouped by purpose    │
;; └────────────────────────────────────────────────────────┘
;; Layout only: every colour comes from the active theme (../colors.ini).
;; Single polybar process over a transparent background with rounded Nerd Font
;; endcaps, so BarWatch, struts, and BarAnchor work without extra processes.

[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = ../colors.ini
include-file = modules.ini

[bar/mira-islands]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = true

width = 100%
height = 30
offset-x = 0
offset-y = 0

background = ${color.trans}
foreground = ${color.fg}

radius = 0
line-size = 0

border-top-size = 8
border-bottom-size = 2
border-left-size = 12
border-right-size = 12
border-color = ${color.trans}

padding-left = 0
padding-right = 0
module-margin = 0

; 1 UI text · 2 icons · 3 slanted pill endcaps (22.5pt @ 96 DPI = exact 30px) · 4 mono metrics
font-0 = "Inter:style=SemiBold:pixelsize=13;3"
font-1 = "Material Design Icons Desktop:pixelsize=18;4"
font-2 = "Mira Caps:size=22.5:hinting=false:antialias=true:rgba=none;4"
font-3 = "JetBrainsMono Nerd Font:style=SemiBold:pixelsize=13;3"

; Islands grouped by purpose:
;   [search, workspaces] [layout, theme, wallpaper, clipboard]
;   [clock, date]
;   [tray, media, notifications, updates] [bluetooth, network, volume, battery] [power]
modules-left = cap-l search ws cap-r gap cap-l2 layout rice wall clip cap-r2
modules-center = cap-l3 clock cal cap-r3
modules-right = cap-l4 tray media notif updates cap-r4 gap2 cap-l5 bluetooth network volume battery cap-r5 gap3 cap-l6 power cap-r6

separator =
dim-value = 1.0

wm-restack = bspwm
enable-struts = true
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]
screenchange-reload = false
compositing-background = over
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false
