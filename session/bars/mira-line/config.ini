;; ┌────────────────────────────────────────────────────────┐
;; │ mira-line — technical topbar with active window title  │
;; └────────────────────────────────────────────────────────┘
;; Layout only: every colour comes from the active theme (../colors.ini).
;; Crisp 36px full-width monochrome rail with a hairline bottom rule,
;; underlined numbered workspaces, and live focused window title.

[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = ../colors.ini
include-file = modules.ini

[bar/mira-line]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = true

width = 100%
height = 36
offset-x = 0
offset-y = 0

background = ${color.bg}
foreground = ${color.fg}

radius = 0
line-size = 2
line-color = ${color.pill}

border-bottom-size = 1
border-color = ${color.black}

padding-left = 12px
padding-right = 12px
module-margin = 5px

; 1 monospace text · 2 icons · 3 UI title
font-0 = "JetBrainsMono Nerd Font:style=SemiBold:pixelsize=13;3"
font-1 = "Material Design Icons Desktop:pixelsize=18;4"
font-2 = "Inter:style=Medium:pixelsize=12;3"

modules-left = search ws layout sep title
modules-center = clock cal
modules-right = tray rice wall clip notif updates sep media bluetooth network volume cpu memory battery sep power

separator =
dim-value = 1.0

wm-restack = bspwm
enable-struts = true
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]
screenchange-reload = false
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false
