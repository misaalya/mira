;; ┌─────────────────────────────────────────────────────────────────┐
;; │ mira-islands-v2 — bold full-pill Dynamic Island topbar (44px)   │
;; └─────────────────────────────────────────────────────────────────┘
;; Layout only: every colour comes from the active theme (../colors.ini).
;; Matches original `mira` height (44px), bold 15px monospace & 20px icons,
;; sculpted into three wide, upright full-semicircle (r=22px) floating
;; capsules using Mira Caps U+E102 / U+E103 in a single polybar process.

[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = ../colors.ini
include-file = modules.ini

[bar/mira-islands-v2]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = true

width = 100%
height = 44
offset-x = 0
offset-y = 0

background = ${color.trans}
foreground = ${color.fg}

radius = 0
line-size = 0

border-top-size = 8
border-bottom-size = 2
border-left-size = 14
border-right-size = 14
border-color = ${color.trans}

padding-left = 0
padding-right = 0
module-margin = 0

; 1 bold mono text (mira scale) · 2 icons (mira scale) · 3 upright full-pill caps (33pt @ 96 DPI = exact 44px)
font-0 = "JetBrainsMono Nerd Font:style=Bold:pixelsize=15;4"
font-1 = "Material Design Icons Desktop:pixelsize=20;4"
font-2 = "Mira Caps:size=33:hinting=false:antialias=true:rgba=none;6"

; Three commanding Dynamic Islands:
;   Left:   search, screenshot, workspaces | theme, wallpaper, layout, clipboard, notif, updates
;   Center: clock · date (plush iOS Dynamic Island focal pill)
;   Right:  tray, media, bluetooth, network, volume | cpu, memory, battery | power
modules-left = cap-l search shot ws sep rice wall layout clip notif updates cap-r
modules-center = cap-l2 clock dot cal cap-r2
modules-right = cap-l3 tray media bluetooth network volume sep2 cpu memory battery sep3 power cap-r3

separator =
dim-value = 1.0

wm-restack = bspwm
enable-struts = true
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]
screenchange-reload = false
compositing-background = over
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false
