;; mira-islands-v2 modules. Every module paints ${color.bg} so each group forms
;; one bold, opaque 44px capsule between upright full-pill endcaps (U+E102 /
;; U+E103 from assets/fonts/MiraCaps.ttf, built by tools/make-caps-font.py).

[module/cap-l]
type = custom/text
label = ""
label-font = 3
label-foreground = ${color.bg}
label-background = ${color.trans}

[module/cap-r]
type = custom/text
label = ""
label-font = 3
label-foreground = ${color.bg}
label-background = ${color.trans}

[module/cap-l2]
inherit = module/cap-l

[module/cap-r2]
inherit = module/cap-r

[module/cap-l3]
inherit = module/cap-l

[module/cap-r3]
inherit = module/cap-r

[module/sep]
type = custom/text
label = "│"
label-foreground = ${color.grey}
label-background = ${color.bg}
label-padding = 7px

[module/sep2]
inherit = module/sep

[module/sep3]
inherit = module/sep

[module/dot]
type = custom/text
label = "·"
label-foreground = ${color.grey}
label-background = ${color.bg}
label-padding = 8px

;; ── left island ───────────────────────────────────────────────────────

[module/search]
type = custom/text
label = "󰍉"
label-font = 2
label-background = ${color.bg}
label-padding = 7px
click-left = RofiLauncher --launcher --pointer
click-right = BarSelector

[module/shot]
type = custom/text
label = "󰹑"
label-font = 2
label-background = ${color.bg}
label-padding = 7px
click-left = OpenApps --screenshot

[module/ws]
type = internal/bspwm
enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false

format = <label-state>
format-font = 2
format-background = ${color.bg}
format-padding = 4px

label-focused = 󰺕
label-focused-padding = 3px
label-focused-foreground = ${color.pill}

label-occupied = 󰀚
label-occupied-padding = 3px
label-occupied-foreground = ${color.fg}

label-urgent = 󰀚
label-urgent-padding = 3px
label-urgent-foreground = ${color.red}

label-empty = 󰑊
label-empty-padding = 3px
label-empty-foreground = ${color.grey}

[module/rice]
type = custom/text
label = "󰸌"
label-font = 2
label-background = ${color.bg}
label-padding = 6px
click-left = RiceSelector
click-right = BarSelector

[module/wall]
type = custom/text
label = "󰥶"
label-font = 2
label-background = ${color.bg}
label-padding = 6px
click-left = WallSelect

;; Name must stay "layout": bin/Layout pokes "#layout.hook.0" on change.
[module/layout]
type = custom/ipc
hook-0 = Layout icon --bar
initial = 1
format = <label>
format-background = ${color.bg}
format-padding = 6px
label-font = 2
click-left = Layout next --bar
click-right = Layout prev --bar

[module/clip]
type = custom/text
label = "󰨸"
label-font = 2
label-background = ${color.bg}
label-padding = 6px
click-left = ClipMenu --pointer

;; Name must stay "notif": bin/NotifPanel pokes "#notif.hook.0" on change.
[module/notif]
type = custom/ipc
hook-0 = "$MIRA_CONFIG_DIR/bars/mira/scripts/notif"
initial = 1
format = <label>
format-background = ${color.bg}
format-padding = 7px
label = %output%
click-left = NotifPanel --pointer
click-right = NotifPanel dnd toggle

;; Name must stay "updates": bin/Updates pokes "#updates.hook.0".
[module/updates]
type = custom/ipc
hook-0 = Updates --cached
initial = 1
format = <label>
format-background = ${color.bg}
format-padding = 7px
format-prefix = "󰆧 "
format-prefix-font = 2
label = %output%
click-left = OpenApps --checkupdates

;; ── centre dynamic island ─────────────────────────────────────────────

[module/clock]
type = internal/date
interval = 5
time = %H:%M
format = <label>
format-background = ${color.bg}
format-padding = 0
label = "%{O14}%time%"
label-foreground = ${color.fg}

[module/cal]
type = internal/date
interval = 60
date = %a %d %b
format = <label>
format-background = ${color.bg}
format-padding = 0
label = "%date%%{O14}"
label-foreground = ${color.grey}

;; ── right island ──────────────────────────────────────────────────────

[module/tray]
type = internal/tray
format = <tray>
format-background = ${color.bg}
tray-background = ${color.bg}
tray-foreground = ${color.fg}
tray-spacing = 6px
tray-padding = 6px
tray-size = 50%

;; The one accent icon.
[module/media]
type = custom/text
label = "󰎈"
label-font = 2
label-foreground = ${color.pill}
label-background = ${color.bg}
label-padding = 7px
click-left = BarPanel toggle music --pointer
click-right = MediaControl --toggle

[module/bluetooth]
type = custom/script
exec = bluetooth-polybar.sh fg grey
interval = 10
format = <label>
format-font = 2
format-background = ${color.bg}
format-padding = 6px
label = %output%
click-left = OpenApps --bluetooth --pointer

[module/network]
type = internal/network
interface = ${system.sys_network_interface}
interval = 5
format-connected = <label-connected>
format-connected-background = ${color.bg}
format-connected-padding = 6px
label-connected = "%{A1:OpenApps --netmanager --pointer:}%{T2}󰖩%{T-}%{A}"
format-disconnected = <label-disconnected>
format-disconnected-background = ${color.bg}
format-disconnected-padding = 6px
label-disconnected = "%{A1:OpenApps --netmanager --pointer:}%{T2}󰖪%{T-}%{A}"
label-disconnected-foreground = ${color.grey}

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = %{A1:VolumeCtl popup --pointer:}<ramp-volume> <label-volume>%{A}
format-volume-background = ${color.bg}
format-volume-padding = 7px
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 2
format-muted = %{A1:VolumeCtl popup --pointer:}<label-muted>%{A}
format-muted-background = ${color.bg}
format-muted-padding = 7px
label-muted = "%{T2}󰖁%{T-}"
label-muted-foreground = ${color.grey}
click-middle = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = OpenApps --soundcontrol

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-background = ${color.bg}
format-padding = 7px
format-prefix = "󰍛 "
format-prefix-font = 2
label = "%percentage%%"

[module/memory]
type = internal/memory
interval = 5
format = <label>
format-background = ${color.bg}
format-padding = 7px
format-prefix = "󰘚 "
format-prefix-font = 2
label = "%used%"

[module/battery]
type = internal/battery
full-at = 99
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 10
format-charging = <animation-charging> <label-charging>
format-charging-background = ${color.bg}
format-charging-padding = 7px
format-discharging = <ramp-capacity> <label-discharging>
format-discharging-background = ${color.bg}
format-discharging-padding = 7px
format-full = <label-full>
format-full-background = ${color.bg}
format-full-padding = 7px
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = "%{T2}󰁹%{T-} %percentage%%"
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰂂
ramp-capacity-font = 2
ramp-capacity-0-foreground = ${color.red}
animation-charging-0 = 󰂄
animation-charging-font = 2
animation-charging-framerate = 2000

[module/power]
type = custom/text
label = "󰐥"
label-font = 2
label-background = ${color.bg}
label-padding = 7px
click-left = PowerMenu --pointer
