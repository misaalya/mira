[package]
name = "misa-clip"
version = "0.1.0"
edition = "2021"
description = "Small clipboard history daemon for the bspwm rice (replaces CopyQ)"
authors = ["Misaalya"]
license = "GPL-3.0-only"

# No crates: Xlib and XFixes are called directly, so the build needs no
# network and the binary stays small.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
