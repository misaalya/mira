[package]
name = "misa-backdrop"
version = "0.1.0"
edition = "2021"
description = "Dim, blurred backdrop behind the rice's popups (bspwm rice)"
authors = ["Misaalya"]
license = "GPL-3.0-only"

# No crates: Xlib is called directly (offline build, tiny binary).
[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
