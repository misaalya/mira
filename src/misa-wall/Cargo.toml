[package]
name = "misa-wall"
version = "0.1.0"
edition = "2021"
description = "Hyper-optimized X11 wallpaper engine with Mira's original Luma-Halftone Develop transition"
authors = ["Misaalya"]
license = "GPL-3.0-only"

# No crates: libX11, libXext (MIT-SHM), libXrender (3x nearest scale), and
# libXrandr are linked directly; libGL & libgdk_pixbuf-2.0 are loaded lazily
# via dlopen only during baking or static image decoding.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
